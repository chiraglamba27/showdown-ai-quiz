version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: showdown-app
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    restart: unless-stopped
